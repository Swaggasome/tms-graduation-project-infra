name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars.example'
      - '.github/workflows/terraform-ci-cd.yml'
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars.example'
      - '.github/workflows/terraform-ci-cd.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Run terraform apply'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: '1.8.5'
  TF_IN_AUTOMATION: 'true'
  YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
  YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
  YC_TOKEN: ${{ secrets.YC_TOKEN }}
  YC_SERVICE_ACCOUNT_KEY_FILE: ${{ github.workspace }}/yc-sa-key.json

jobs:
  discover:
    name: Discover Terraform directories
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          dirs=()
          while IFS= read -r dir; do
            [[ -n "$dir" ]] && dirs+=("$dir")
          done < <(find . -type f -name '*.tf' -not -path './.terraform/*' -not -path '*/.terraform/*' -printf '%h\n' | sort -u | sed 's#^./##')

          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json='{"include":['
          first=true
          for dir in "${dirs[@]}"; do
            if [[ "$first" == true ]]; then
              first=false
            else
              json+=','
            fi
            json+="{\"dir\":\"${dir}\"}"
          done
          json+=']}'

          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  terraform:
    name: Terraform ${{ matrix.dir }}
    runs-on: ubuntu-latest
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.dir }}
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write Yandex Cloud service account key
        if: ${{ secrets.YC_SA_JSON_CREDENTIALS != '' }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > "$YC_SERVICE_ACCOUNT_KEY_FILE"
          chmod 600 "$YC_SERVICE_ACCOUNT_KEY_FILE"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event.inputs.apply != 'true' }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true' }}
        run: terraform apply -input=false -auto-approve
